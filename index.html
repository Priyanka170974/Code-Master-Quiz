<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CodeMaster Quiz 💻</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="tickSound" src="https://www.soundjay.com/clock/sounds/clock-ticking-1.mp3"></audio>
<audio id="correctSound" src="https://www.soundjay.com/buttons/sounds/button-4.mp3"></audio>
<audio id="wrongSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<canvas id="sparkCanvas"></canvas>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1 id="quizTitle">CodeMaster Quiz 💻</h1>
        <div id="timerBox">⏱ Time Left: <span id="timer">30</span>s</div>
    </div>

    <!-- 🔥 WELCOME + LOGIN -->
    <div id="loginBox" class="card">
        <h1 style="
    font-size:35px;
    line-height:1.3;
    margin-bottom:15px;
    text-align:center;
">
     Welcome✨ <br>
    CodeMaster Quiz 💻
</h1>
       <p style="
    font-size:27px;
    margin-top:10px;
    font-weight:bold;
    color:white;
">
    Test your coding skills 🚀
</p>
     <input 
type="text" 
id="username" 
placeholder="Enter your Name"

style="
padding:14px 18px;
width:90%;
margin:15px 0;
border-radius:15px;
border:2px solid #6b6ffb;
outline:none;
font-size:18px;
background:#132b4f;
color:white;
box-shadow:0 0 10px rgba(107,111,251,0.3);
transition:0.3s;
">

        <button class="action-btn" onclick="loginUser()">Start Quiz</button>
    </div>

    <!-- LANGUAGE SELECTION -->
    <div id="languageSelection" class="card" style="display:none;">
        <h2>Choose Your Coding Language 📝</h2>

        <button class="lang-btn" onclick="loadQuiz('HTML')">HTML</button>
        <button class="lang-btn" onclick="loadQuiz('C')">C</button>
        <button class="lang-btn" onclick="loadQuiz('C++')">C++</button>
        <button class="lang-btn" onclick="loadQuiz('Java')">Java</button>
        <button class="lang-btn" onclick="loadQuiz('Python')">Python</button>
    </div>

    <!-- QUIZ -->
   <div id="quizBox" class="card" style="display:none;">

    <div class="progress-bar">
        <div id="progress"></div>
    </div>

    <form id="quizForm"></form>
<button id="submitBtn" type="button" style="display:none;">
    Submit Quiz 🚀
</button>

</div>

    <!-- SCORE -->
<div id="scoreBox" class="card" style="display:none; text-align:center;">
    
    <h2 id="scoreText"></h2>

    <button 
    id="reviewBtn"
    class="action-btn"
    onclick="showReview()"
    style="display:none;">

    📋 Check Answers
</button>

    <br><br>

    <!-- Leaderboard Button -->
    <button 
        class="action-btn"
        onclick="showLeaderboard()">

        🏆 Show Leaderboard
    </button>

</div>

        

    <!-- LEADERBOARD -->
<div id="leaderboardBox" class="card" style="display:none; text-align:center;">

    <h2>🏆 Leaderboard</h2>

    <ul id="leaderboardList"></ul>

    <br>

    <button class="action-btn" onclick="backToScore()">
        ⬅ Back
    </button>

</div>
<!-- QUIZ -->


    <!-- REVIEW -->
    <div id="reviewBox" class="card" style="display:none;"></div>

</div>

<!-- 🔥 FIX: defer add kiya -->
<script src="script.js" defer></script>

</body>
</html>
